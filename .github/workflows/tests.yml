name: Tests

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  PYVISTA_OFF_SCREEN: "true"

jobs:
  smoke:
    name: Package and minimal example
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgl1 \
            libgl1-mesa-dri \
            libglu1-mesa

      - name: Install uv
        run: python -m pip install uv

      - name: Build and install wheel
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/dist"
          uv pip install --system pytest "$RUNNER_TEMP"/dist/*.whl

      - name: Verify the core-only installation
        run: pytest -q tests/test_package.py

      - name: Install visualisation dependencies
        run: uv pip install --system plotly pyvista

      - name: Run minimal-example test
        run: >-
          xvfb-run -a pytest -q
          tests/test_examples.py::test_minimal_example

  full-release:
    name: Full release examples
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgl1 \
            libgl1-mesa-dri \
            libglu1-mesa

      - name: Install uv
        run: python -m pip install uv

      - name: Build and install wheel
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/dist"
          uv pip install --system pytest plotly pyvista "$RUNNER_TEMP"/dist/*.whl

      - name: Run package and all-example tests
        run: xvfb-run -a pytest -q tests
